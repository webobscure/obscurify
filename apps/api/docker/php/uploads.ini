; The base php:8.4-fpm-alpine image ships with no active php.ini at all,
; so PHP falls back to its compiled-in defaults (upload_max_filesize=2M,
; post_max_size=8M) — well under the 10MB+ media the app accepts, causing
; every larger upload to be rejected at the PHP layer before Laravel's own
; request validation ever runs. post_max_size is kept above
; upload_max_filesize to leave room for the other multipart fields (alt,
; position) alongside the file; both stay in step with
; StoreMediaRequest::MAX_FILE_KB and infra/nginx/default.conf's
; client_max_body_size.
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 60
max_input_time = 60
